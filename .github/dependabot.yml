# Weekly updates, held 14 days after a release so a poisoned version is usually pulled before it arrives.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      testing:
        patterns: ["@playwright/test", "@axe-core/*", "html-validate"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 14
