# SPDX-License-Identifier: GPL-3.0-or-later
# Every push and pull request: dependencies audited, secrets scanned, the site built and checked (types, HTML,
# CSP, placeholders, translations, links), then opened page by page in a browser on a computer and on a phone.
# A red run is an alarm, not a gate: Cloudflare deploys main regardless, and the safety nets are the content
# schema at build time, Rollback and Revert (docs/OPERATIONS.md).
# Every action is pinned to a full commit SHA; the token is read-only; nothing runs for forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  check:
    name: Audit, build, check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads the history

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci, scripts ignored by .npmrc)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Types (astro check)
        run: npm run check

      - name: HTML validity
        run: npm run lint:html

      - name: Content-Security-Policy (no inline code, no third party)
        run: npm run csp:check

      - name: No placeholder left
        run: npm run placeholders:check

      - name: Translations (missing = error, stale = warning)
        run: npm run i18n:check

      - name: Links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --accept 200..=299,403,429 --max-concurrency 8 --exclude-path dist/_astro 'dist/**/*.html'
          fail: true

      - name: Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Every page, every language, computer and phone
        run: npm run test:e2e

      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
